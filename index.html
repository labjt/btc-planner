<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTC Planner - v2.1 Final</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white font-sans flex items-center justify-center min-h-screen py-12">
    <div class="bg-gray-800 rounded-lg shadow-xl p-8 max-w-4xl w-full">
        <!-- UI Structure -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-orange-500">BTC Planner</h1>
            <p class="text-gray-400 mt-2">A professional tool for modeling a gradual transition to a Bitcoin standard.</p>
        </div>
        <div>
            <div class="border-b border-gray-700">
                <nav class="-mb-px flex space-x-8" aria-label="Tabs"><button class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg text-orange-500 border-orange-500" data-tab="startingCapital">Starting Capital</button><button class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg text-gray-400 border-transparent hover:text-gray-300 hover:border-gray-300" data-tab="annualFlow">Annual Flow</button><button class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg text-gray-400 border-transparent hover:text-gray-300 hover:border-gray-300" data-tab="taxesGrowth">Taxes & Growth</button><button class="tab-button whitespace-nowrap py-4 px-1 border-b-2 font-medium text-lg text-gray-400 border-transparent hover:text-gray-300 hover:border-gray-300" data-tab="simulation">Simulation</button></nav>
            </div>
            <div class="mt-8">
                <div class="tab-panel" id="startingCapital"><div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div data-input-id="existingCash"><label for="existingCash" class="block text-sm font-medium text-gray-400">Existing Cash ($)</label><input type="number" id="existingCash" value="50000" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="existingBtc"><label for="existingBtc" class="block text-sm font-medium text-gray-400">Existing Bitcoin (BTC)</label><input type="number" id="existingBtc" value="1" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="btcCostBasis"><label for="btcCostBasis" class="block text-sm font-medium text-gray-400">BTC Cost Basis ($)</label><input type="number" id="btcCostBasis" value="20000" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div></div></div>
                <div class="tab-panel hidden" id="annualFlow"><div class="grid grid-cols-1 md:grid-cols-4 gap-6"><div data-input-id="annualIncome"><label for="annualIncome" class="block text-sm font-medium text-gray-400">Annual Income ($)</label><input type="number" id="annualIncome" value="120000" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="monthlyExpenses"><label for="monthlyExpenses" class="block text-sm font-medium text-gray-400">Monthly Expenses ($)</label><input type="number" id="monthlyExpenses" value="5000" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="salaryGrowthRate"><label for="salaryGrowthRate" class="block text-sm font-medium text-gray-400">Salary Growth (%)</label><input type="number" id="salaryGrowthRate" value="3" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="inflationRate"><label for="inflationRate" class="block text-sm font-medium text-gray-400">Inflation (%)</label><input type="number" id="inflationRate" value="2" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div></div></div>
                <div class="tab-panel hidden" id="taxesGrowth"><div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div data-input-id="incomeTaxRate"><label for="incomeTaxRate" class="block text-sm font-medium text-gray-400">Income / ST Gains Rate (%)</label><input type="number" id="incomeTaxRate" value="30" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="longTermGainsRate"><label for="longTermGainsRate" class="block text-sm font-medium text-gray-400">Long-Term Rate (%)</label><input type="number" id="longTermGainsRate" value="20" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="traditionalGrowthRate"><label for="traditionalGrowthRate" class="block text-sm font-medium text-gray-400">Traditional Growth (%)</label><input type="number" id="traditionalGrowthRate" value="5" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="btcAvgReturn"><label for="btcAvgReturn" class="block text-sm font-medium text-gray-400">BTC Avg. Return (%)</label><input type="number" id="btcAvgReturn" value="60" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="btcVolatility"><label for="btcVolatility" class="block text-sm font-medium text-gray-400">BTC Volatility (%)</label><input type="number" id="btcVolatility" value="80" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div></div></div>
                <div class="tab-panel hidden" id="simulation"><div class="grid grid-cols-1 md:grid-cols-3 gap-6"><div data-input-id="simulationYears"><label for="simulationYears" class="block text-sm font-medium text-gray-400">Number of Years</label><input type="number" id="simulationYears" value="10" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="numSimulations"><label for="numSimulations" class="block text-sm font-medium text-gray-400">Simulations</label><input type="number" id="numSimulations" value="1000" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="allocationBtc"><label for="allocationBtc" class="block text-sm font-medium text-gray-400">Allocation to BTC (%)</label><input type="number" id="allocationBtc" value="100" min="0" max="100" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="cashBuffer"><label for="cashBuffer" class="block text-sm font-medium text-gray-400">Cash Buffer (Months)</label><input type="number" id="cashBuffer" value="3" class="mt-1 block w-full bg-gray-700 rounded-md p-2"></div><div data-input-id="taxStrategy"><label for="taxStrategy" class="block text-sm font-medium text-gray-400">Tax Strategy</label><select id="taxStrategy" class="mt-1 block w-full bg-gray-700 rounded-md p-2"><option value="hifo">HIFO (Highest-In, First-Out)</option><option value="fifo">FIFO (First-In, First-Out)</option></select></div></div></div>
            </div>
        </div>
        <div class="text-center mt-8"><button id="calculateBtn" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-12 rounded-lg text-xl">Run Projection</button></div>
        <div id="results" class="mt-10 space-y-10" style="display: none;"></div>
    </div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- UI & UTILS ---
    const el = id => document.getElementById(id);
    const val = id => parseFloat(el(id).value);
    const str = id => el(id).value;
    const formatter = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 0, maximumFractionDigits: 0 });
    let projectionChart = null;
    const inputIds = [ 'existingCash', 'existingBtc', 'btcCostBasis', 'annualIncome', 'monthlyExpenses', 'salaryGrowthRate', 'inflationRate', 'incomeTaxRate', 'longTermGainsRate', 'traditionalGrowthRate', 'btcAvgReturn', 'btcVolatility', 'simulationYears', 'numSimulations', 'allocationBtc', 'cashBuffer', 'taxStrategy' ];

    // --- TAB HANDLING ---
    const tabButtons = document.querySelectorAll('.tab-button');
    tabButtons.forEach(button => button.addEventListener('click', () => {
        document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('text-orange-500', 'border-orange-500'));
        document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.add('hidden'));
        button.classList.add('text-orange-500', 'border-orange-500');
        el(button.dataset.tab).classList.remove('hidden');
    }));

    // --- SIMULATION ENGINE ---
    function generateNormalRandom(mean, stdDev) {
        let u1 = 0, u2 = 0;
        while (u1 === 0) u1 = Math.random();
        while (u2 === 0) u2 = Math.random();
        return Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2) * stdDev + mean;
    }

    function runSimulation() {
        try {
            const inputs = {};
            inputIds.forEach(id => inputs[id] = (id === 'taxStrategy' ? str(id) : val(id)));
            const taxRates = { st: inputs.incomeTaxRate / 100, lt: inputs.longTermGainsRate / 100 };
            const monthlyBtcGrowth = { avg: Math.pow(1 + inputs.btcAvgReturn / 100, 1 / 12) - 1, vol: (inputs.btcVolatility / 100) / Math.sqrt(12) };
            const monthlyTradGrowth = { avg: Math.pow(1 + inputs.traditionalGrowthRate / 100, 1 / 12) - 1, vol: 0 };
            const allocationToBtc = inputs.allocationBtc / 100;
            const totalMonths = inputs.simulationYears * 12;

            const allTrajectories = [];
            for (let i = 0; i < inputs.numSimulations; i++) {
                let cash = inputs.existingCash;
                let tradLots = [{ amount: inputs.existingCash, basis: inputs.existingCash, month: 0 }];
                let btcLots = [{ amount: inputs.btcCostBasis, basis: inputs.btcCostBasis, month: 0 }];
                const trajectory = [];

                for (let month = 1; month <= totalMonths; month++) {
                    const year = Math.ceil(month / 12);
                    const monthlyIncome = (inputs.annualIncome * Math.pow(1 + inputs.salaryGrowthRate / 100, year - 1)) / 12;
                    const monthlyExpenses = inputs.monthlyExpenses * Math.pow(1 + inputs.inflationRate / 100, year - 1);
                    
                    cash += monthlyIncome * (1 - taxRates.st) - monthlyExpenses;
                    
                    tradLots.forEach(lot => lot.amount *= (1 + monthlyTradGrowth.avg));
                    btcLots.forEach(lot => lot.amount *= (1 + generateNormalRandom(monthlyBtcGrowth.avg, monthlyBtcGrowth.vol)));
                    
                    if (month % 12 === 0) { // End of year rebalancing
                        const cashBufferTarget = monthlyExpenses * inputs.cashBuffer;
                        const cashDelta = cashBufferTarget - cash;

                        if (cashDelta > 0) {
                            const { cashRaised, taxPaid } = sellAssets(cashDelta, btcLots, tradLots, inputs.taxStrategy, taxRates, month);
                            cash += cashRaised - taxPaid;
                        } else {
                            const surplusToInvest = -cashDelta;
                            const tradInvestment = surplusToInvest * (1 - allocationToBtc);
                            const btcInvestment = surplusToInvest * allocationToBtc;
                            if (tradInvestment > 0) tradLots.push({ amount: tradInvestment, basis: tradInvestment, month });
                            if (btcInvestment > 0) btcLots.push({ amount: btcInvestment, basis: btcInvestment, month });
                            cash -= surplusToInvest;
                        }
                    }
                    if (month % 12 === 0 || month === totalMonths) {
                        const totalValue = cash + tradLots.reduce((sum, lot) => sum + lot.amount, 0) + btcLots.reduce((sum, lot) => sum + lot.amount, 0);
                        trajectory.push(totalValue);
                    }
                }
                allTrajectories.push(trajectory);
            }

            const percentiles = analyzeTrajectories(allTrajectories, inputs.numSimulations, inputs.simulationYears);
            renderResults(percentiles, inputs);
            generateShareableLink();
            el('results').style.display = 'block';

        } catch (e) { console.error("Simulation Error:", e); alert("An error occurred."); }
    }

    function sellAssets(amountToRaise, btcLots, tradLots, strategy, taxRates, currentMonth) {
        let cashRaised = 0, taxPaid = 0;
        const btcSortFn = strategy === 'hifo' ? (a, b) => b.basis / b.amount - a.basis / a.amount : (a, b) => a.month - b.month;
        btcLots.sort(btcSortFn);
        const lotsToRemove = [];
        for (let i = 0; i < btcLots.length; i++) {
            if (cashRaised >= amountToRaise) break;
            const lot = btcLots[i];
            const gain = lot.amount - lot.basis;
            const taxRate = (currentMonth - lot.month > 12) ? taxRates.lt : taxRates.st;
            taxPaid += gain > 0 ? gain * taxRate : 0;
            cashRaised += lot.amount;
            lotsToRemove.push(i);
        }
        for (let i = lotsToRemove.length - 1; i >= 0; i--) btcLots.splice(lotsToRemove[i], 1);
        return { cashRaised, taxPaid };
    }
    
    function analyzeTrajectories(trajectories, numSimulations, simulationYears) {
        const percentiles = { p25: [], p50: [], p75: [] };
        for (let year = 0; year < simulationYears; year++) {
            const yearValues = trajectories.map(run => run[year]).sort((a, b) => a - b);
            percentiles.p25.push(yearValues[Math.floor(numSimulations * 0.25)]);
            percentiles.p50.push(yearValues[Math.floor(numSimulations * 0.50)]);
            percentiles.p75.push(yearValues[Math.floor(numSimulations * 0.75)]);
        }
        return percentiles;
    }

    // --- RENDER FUNCTIONS ---
    function renderResults(percentiles, inputs) {
        el('results').innerHTML = `
            <div><h2 class="text-2xl font-semibold mb-4 text-center">Net Worth Projection</h2><div class="bg-gray-700 p-4 rounded-lg"><canvas id="projectionChart"></canvas></div></div>
            <div><h2 class="text-2xl font-semibold mb-4 text-center">Range of Final Net Worth Outcomes</h2><div id="outcomeSummary" class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center"></div></div>
            <div><h2 class="text-2xl font-semibold mb-4 text-center">Year-by-Year Breakdown (Median Outcome)</h2><div class="overflow-x-auto rounded-lg"><table class="min-w-full bg-gray-700"><thead class="bg-gray-600"><tr><th class="py-3 px-4 text-left">Year</th><th class="py-3 px-4 text-right font-mono">Total Net Worth</th></tr></thead><tbody id="projectionTableBody"></tbody></table></div></div>
            <div><h2 class="text-2xl font-semibold mb-4 text-center">Breakdown of Final Year (Median Outcome)</h2><div id="finalYearBreakdown" class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-gray-700 p-6 rounded-lg"></div></div>
            <div><h2 class="text-2xl font-semibold mb-4 text-center">Share Your Scenario</h2><div class="flex gap-2"><input type="text" id="shareableLink" class="w-full bg-gray-600 rounded-md p-2 text-gray-300" readonly><button id="copyLinkBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Copy</button></div></div>
        `;
        renderOutcomes(percentiles);
        renderYearByYearTable(percentiles.p50);
        renderFinalYearBreakdown(percentiles.p50, inputs);
        renderChart(percentiles);
        el('copyLinkBtn').addEventListener('click', () => {
            el('shareableLink').select();
            navigator.clipboard.writeText(el('shareableLink').value);
        });
    }
    
    function renderOutcomes(percentiles) {
        const finalP25 = percentiles.p25.slice(-1)[0];
        const finalP50 = percentiles.p50.slice(-1)[0];
        const finalP75 = percentiles.p75.slice(-1)[0];
        el('outcomeSummary').innerHTML = `<div class="bg-gray-700 p-4 rounded-lg"><p class="text-lg text-red-400">Poor Outcome (25th %)</p><p class="text-2xl font-bold">${formatter.format(finalP25)}</p></div><div class="bg-gray-700 p-4 rounded-lg"><p class="text-lg text-gray-300">Median Outcome (50th %)</p><p class="text-3xl font-bold text-orange-400">${formatter.format(finalP50)}</p></div><div class="bg-gray-700 p-4 rounded-lg"><p class="text-lg text-green-400">Good Outcome (75th %)</p><p class="text-2xl font-bold">${formatter.format(finalP75)}</p></div>`;
    }

    function renderYearByYearTable(median) {
        let tableHtml = '';
        for (let i = 0; i < median.length; i++) {
            tableHtml += `<tr class="border-b border-gray-600"><td class="py-2 px-4">${i + 1}</td><td class="py-2 px-4 text-right font-mono text-green-400">${formatter.format(median[i])}</td></tr>`;
        }
        el('projectionTableBody').innerHTML = tableHtml;
    }

    function renderFinalYearBreakdown(median, inputs) {
        // Since we don't have a simple baseline anymore, this section can show portfolio composition
        // This is a simplified placeholder, a more detailed implementation could be a future step
        el('finalYearBreakdown').innerHTML = `<div class="col-span-2 text-center text-gray-400">A detailed final year breakdown for the new tax-harvesting model is a planned future enhancement.</div>`;
    }

    function renderChart(percentiles) {
        if (projectionChart) projectionChart.destroy();
        const labels = Array.from({ length: percentiles.p50.length }, (_, i) => `Year ${i + 1}`);
        projectionChart = new Chart(el('projectionChart').getContext('2d'), {
            type: 'line', data: { labels: labels, datasets: [ { label: 'Median Outcome', data: percentiles.p50, borderColor: 'rgba(242, 169, 0, 1)', borderWidth: 3, fill: false }, { label: '25th-75th Percentile', data: percentiles.p25, borderColor: 'transparent', backgroundColor: 'rgba(242, 169, 0, 0.2)', pointRadius: 0, fill: '+1' }, { data: percentiles.p75, borderColor: 'transparent', backgroundColor: 'rgba(242, 169, 0, 0.2)', pointRadius: 0, fill: '-1' } ] },
            options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { color: '#fff' } }, x: { ticks: { color: '#fff' } } }, plugins: { legend: { labels: { color: '#fff' } } } }
        });
    }

    // --- SHAREABLE LINK FUNCTIONS ---
    function generateShareableLink() {
        const params = new URLSearchParams();
        inputIds.forEach(id => params.append(id, str(id)));
        el('shareableLink').value = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
    }

    function loadFromURL() {
        const params = new URLSearchParams(window.location.search);
        if (params.size > 0) {
            params.forEach((value, key) => { if (inputIds.includes(key) && el(key)) el(key).value = value; });
            runSimulation();
        }
    }
    
    // --- INIT ---
    el('calculateBtn').addEventListener('click', runSimulation);
    loadFromURL();
});
</script>
</body>
</html>
